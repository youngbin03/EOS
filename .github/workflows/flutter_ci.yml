name: Flutter CI/CD

# 워크플로우 트리거 조건
on:
  # Pull Request가 생성되거나 업데이트될 때
  pull_request:
    branches: [ main, week9-solution ]  # week9-solution 브랜치 추가
  # 브랜치에 push될 때
  push:
    branches: [ main, week9-solution ]  # week9-solution 브랜치 추가
  # 수동으로 워크플로우 실행 가능
  workflow_dispatch:

# 환경 변수 설정
env:
  FLUTTER_VERSION: '3.24.0'  # 사용할 Flutter 버전

jobs:
  # 1단계: 코드 분석 및 단위 테스트
  test:
    name: 🧪 Test & Analysis
    runs-on: ubuntu-latest
    
    steps:
    # 코드 체크아웃
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    # Flutter SDK 설치
    - name: 🔧 Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true
    
    # 의존성 설치
    - name: 📦 Install dependencies
      run: flutter pub get
    
    # 코드 포맷 검사
    - name: 🎨 Check formatting
      run: |
        # 모든 파일을 먼저 포맷팅 (자동 생성 파일 포함)
        dart format .
        # Git 상태 확인 (수동 작성 파일만 체크)
        if ! git diff --quiet --exit-code lib/src/ test/src/ lib/main.dart lib/theme/; then
          echo "코드 포맷팅이 필요합니다. 'dart format .'을 실행하세요."
          git diff
          exit 1
        fi
    
    # 정적 분석 (린트)
    - name: 🔍 Analyze code
      run: flutter analyze
    
    # Mock 파일 생성
    - name: 🏗️ Generate mocks
      run: dart run build_runner build --delete-conflicting-outputs
    
    # 단위 테스트 실행
    - name: 🧪 Run unit tests
      run: flutter test --coverage
    
    # 테스트 커버리지 업로드 (Codecov)
    - name: 📊 Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: coverage/lcov.info
        fail_ci_if_error: false

  # 2단계: 위젯 테스트 (Golden Test 포함)
  widget_test:
    name: 🎨 Widget Tests
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔧 Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true
    
    - name: 📦 Install dependencies
      run: flutter pub get
    
    - name: 🏗️ Generate mocks
      run: dart run build_runner build --delete-conflicting-outputs
    
    # Golden Test 실행
    - name: 🖼️ Run widget tests with golden files
      run: flutter test --update-goldens
    
    # Golden Test 결과 아티팩트로 저장
    - name: 📁 Upload golden files
      uses: actions/upload-artifact@v3
      if: failure()
      with:
        name: golden-files
        path: test/**/goldens/

  # 3단계: 통합 테스트 (Android)
  integration_test_android:
    name: 🤖 Integration Tests (Android)
    runs-on: macos-latest  # Android 에뮬레이터를 위해 macOS 사용
    needs: [test, widget_test]
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔧 Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true
    
    - name: 📦 Install dependencies
      run: flutter pub get
    
    # Java 설정
    - name: ☕ Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'
    
    # Android SDK 설정
    - name: 🤖 Setup Android SDK
      uses: android-actions/setup-android@v3
    
    # Android 에뮬레이터 실행
    - name: 🚀 Run Android emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 29
        target: default
        arch: x86_64
        profile: Nexus 6
        script: |
          flutter test integration_test/app_test.dart --verbose

  # 4단계: 통합 테스트 (iOS)
  integration_test_ios:
    name: 🍎 Integration Tests (iOS)
    runs-on: macos-latest
    needs: [test, widget_test]
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔧 Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true
    
    - name: 📦 Install dependencies
      run: flutter pub get
    
    # iOS 시뮬레이터에서 통합 테스트 실행
    - name: 🍎 Run iOS integration tests
      run: |
        # iOS 시뮬레이터 시작
        xcrun simctl boot "iPhone 14" || true
        # 통합 테스트 실행
        flutter test integration_test/app_test.dart -d "iPhone 14"

  # 5단계: 빌드 테스트
  build_test:
    name: 🏗️ Build Test
    runs-on: ubuntu-latest
    needs: [test, widget_test]
    
    strategy:
      matrix:
        platform: [android, web]
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔧 Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true
    
    - name: 📦 Install dependencies
      run: flutter pub get
    
    # 플랫폼별 빌드
    - name: 🏗️ Build for ${{ matrix.platform }}
      run: |
        if [ "${{ matrix.platform }}" == "android" ]; then
          flutter build apk --debug
        elif [ "${{ matrix.platform }}" == "web" ]; then
          flutter build web
        fi

  # 6단계: 배포 (main 브랜치에 push될 때만)
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [integration_test_android, integration_test_ios, build_test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔧 Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true
    
    - name: 📦 Install dependencies
      run: flutter pub get
    
    # 프로덕션 빌드
    - name: 🏗️ Build for production
      run: |
        flutter build web --release
        flutter build apk --release
    
    # 빌드 결과물 아티팩트로 저장
    - name: 📁 Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: build-artifacts
        path: |
          build/web/
          build/app/outputs/flutter-apk/ 